<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validador de Consolidados</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Validador de Consolidados</h1>
        
        <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-blue-500">
            <input type="file" id="file-input" class="hidden">
            <p>Arrastra tu Excel aquí o haz clic para subir</p>
        </div>

        <div id="result-container" class="mt-6 hidden">
            <div id="success-section" class="hidden bg-green-50 p-6 rounded-lg border border-green-200 text-center mb-4">
                <p class="text-green-800 font-bold text-xl">✅ ¡Archivo validado!</p>
                <div id="resumen-texto" class="text-left mt-4 text-gray-700 bg-white p-4 rounded border shadow-sm"></div>
                <button id="btn-enviar" class="mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg w-full md:w-auto">
                    🚀 Guardar en el Histórico Maestro
                </button>
            </div>

            <div id="error-section" class="hidden bg-red-50 p-6 rounded-lg border border-red-200">
                <h3 class="text-red-700 font-bold mb-4">❌ Errores detectados:</h3>
                <table class="w-full text-sm text-left text-red-800 border-collapse">
                    <thead class="bg-red-100"><tr><th class="p-2 border">Fila</th><th class="p-2 border">Detalle</th></tr></thead>
                    <tbody id="error-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN: Nombres exactos de columnas (Fila 4 del Excel)
        const REGLAS = {
            "Tipo de OLT": ["OLT CONSUMOS", "OLT MASIVO", "OLT CLAVES"], // Cambia "Tipo de OLT" por el nombre real de tu columna B
        };
        const COL_LINEA = "Línea"; // Nombre exacto de tu columna L

        const URL_GAS = "https://script.google.com/macros/s/AKfycbwVuNAzSxA6xtUbP6wG0njyB_7Pm1qvkGNg_QDS7S8YKALqquZl4NhXosaCqfrb-uA/exec";
        let datosListosParaEnviar = [];

        const fileInput = document.getElementById('file-input');
        document.getElementById('drop-zone').onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                validarYMostrar(XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" }));
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function validarYMostrar(data) {
            let errores = [], validos = [];
            document.getElementById('result-container').classList.remove('hidden');
            document.getElementById('error-section').classList.add('hidden');
            document.getElementById('success-section').classList.add('hidden');

            for (let i = 4; i < data.length; i++) {
                let fila = data[i];
                let filaErrores = [];
                for (let col in REGLAS) {
                    if (fila[col] && !REGLAS[col].includes(fila[col].trim())) filaErrores.push(`Error en ${col}`);
                }
                filaErrores.length > 0 ? errores.push({fila: i+1, msg: filaErrores.join(', ')}) : validos.push(fila);
            }

            if (errores.length > 0) {
                document.getElementById('error-section').classList.remove('hidden');
                document.getElementById('error-table-body').innerHTML = errores.map(e => `<tr><td class="p-2 border font-bold">${e.fila}</td><td class="p-2 border">${e.msg}</td></tr>`).join('');
            } else {
                let counts = { "BIOPAS": 0, "OMPHARMA": 0, "ELEA PERU": 0 };
                validos.forEach(f => { if(counts.hasOwnProperty(f[COL_LINEA])) counts[f[COL_LINEA]]++; });
                
                document.getElementById('success-section').classList.remove('hidden');
                document.getElementById('resumen-texto').innerHTML = `
                    <p>✅ <b>Total filas válidas:</b> ${validos.length}</p>
                    <p class="mt-2 font-bold">📊 Recuento por Línea:</p>
                    <ul class="list-disc ml-6">
                        <li>BIOPAS: ${counts["BIOPAS"]}</li>
                        <li>OMPHARMA: ${counts["OMPHARMA"]}</li>
                        <li>ELEA PERU: ${counts["ELEA PERU"]}</li>
                    </ul>`;
                datosListosParaEnviar = validos;
            }
        }

        document.getElementById('btn-enviar').onclick = () => {
            const btn = document.getElementById('btn-enviar');
            btn.innerText = "⏳ Guardando..."; btn.disabled = true;
            fetch(URL_GAS, { method: "POST", mode: "no-cors", body: JSON.stringify(datosListosParaEnviar) })
            .then(() => { alert("¡Datos guardados!"); btn.innerText = "✅ Guardado"; });
        };
    </script>
</body>
</html>
